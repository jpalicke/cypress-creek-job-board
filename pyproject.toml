[project]
name = "cypress-creek"
version = "0.1.0"
description = "Tailors a job application to a posting without stating a claim the author has not verified."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cypress_creek"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = ["error"]
markers = [
    "live: needs a real model backend; an unreachable backend is an error, never a skip",
    "needs_network: needs the real internet; an unreachable network is an error, never a skip",
]
