name: live
# Runs the live tests against a real Ollama with the small CI model. Not on every push.
on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ollama:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Cache the model directory
        uses: actions/cache@v6
        with:
          path: ~/.ollama/models
          key: ollama-qwen3.5-0.8b
      - name: Start Ollama
        run: |
          ollama serve > ollama.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fs http://localhost:11434/api/version && exit 0
            sleep 2
          done
          cat ollama.log
          exit 1
      - run: ollama pull qwen3.5:0.8b
      - run: ollama --version
      - name: Live tests
        run: uv run --locked pytest tests/e2e tests/integration -m "live and not needs_network and not live_openai and not live_lmstudio" -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser test with a real model
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e:live
        working-directory: web
