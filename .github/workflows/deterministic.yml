name: deterministic
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run --locked ruff check
      - run: uv run --locked ruff format --check
      - run: uv run --locked mypy
      - run: uv run --locked pre-commit run detect-secrets --all-files
      - name: ABOUTME headers
        run: uv run --locked python scripts/check_aboutme.py $(git ls-files '*.py' '*.sh' '*.ts' '*.tsx' '*.js' '*.mjs' '*.cjs' '*.sql' '*.svelte')
      - name: Results table is current
        run: uv run --locked python -m evals.harness.table --check
      - run: uv run --locked pytest tests/unit tests/component --cov --cov-fail-under=80
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      # Offline end to end and integration tests only: real child processes, real SQLite and
      # real loopback servers. Tests that need the internet or a model run in network.yml and live.yml.
      - run: uv run --locked pytest tests/e2e tests/integration -m "not needs_network and not live and not live_openai and not live_lmstudio" -q
  windows:
    # The PDF extractor starts a child process and uses POSIX resource limits where they exist, so
    # the platform sensitive tests also run here. Not a required check.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: PDF extractor, link posting and PDF upload tests
        run: >-
          uv run --locked pytest
          tests/unit/test_pdf_fixtures.py
          tests/integration/test_pdf_hostile.py
          tests/component/test_pdf_worker.py
          tests/component/test_link_posting.py
          tests/component/test_api_postings.py
          tests/e2e/test_pdf_upload_process.py
          -q --no-cov
