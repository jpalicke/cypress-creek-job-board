repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff lint
        entry: uv run --locked ruff check
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff format check
        entry: uv run --locked ruff format --check
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy
        name: mypy strict
        entry: uv run --locked mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: aboutme
        name: ABOUTME header check
        entry: uv run --locked python scripts/check_aboutme.py
        language: system
        types_or: [python, shell, ts, tsx, javascript, sql, svelte]
      - id: web
        name: web lint, types, unit tests and build
        # Needs `npm ci` in web/ once. A missing node_modules fails here, it is never skipped.
        entry: npm --prefix web run verify
        language: system
        files: ^web/
        pass_filenames: false
      - id: pytest
        name: pytest unit and component with coverage gate
        entry: uv run --locked pytest tests/unit tests/component --cov --cov-report=term:skip-covered --cov-fail-under=80 -q
        language: system
        pass_filenames: false
        exclude: '(^docs/|\.md$)'
