repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff lint
        entry: uv run --locked ruff check
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff format check
        entry: uv run --locked ruff format --check
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy
        name: mypy strict
        entry: uv run --locked mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest unit and component with coverage gate
        entry: uv run --locked pytest tests/unit tests/component --cov --cov-fail-under=80
        language: system
        pass_filenames: false
        always_run: true
